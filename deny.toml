[advisories]
ignore = [
  { id = "RUSTSEC-2025-0066", reason = "The generated google-gmail1 client requires the unmaintained google-apis-common runtime; local transport and component tests cover this adapter" },
]

[licenses]
include-dev = true
allow = [
  "LicenseRef-Sloper-Ecosystem-1.0",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# cargo-deny cannot identify custom terms by matching standard license text.
# These declarations apply only while the pinned SDK license bytes match.
[[licenses.clarify]]
crate = "sloper-extension"
expression = "LicenseRef-Sloper-Ecosystem-1.0"
license-files = [{ path = "LICENSE", hash = 0x75f07742 }]

[[licenses.clarify]]
crate = "sloper-extension-spec"
expression = "LicenseRef-Sloper-Ecosystem-1.0"
license-files = [{ path = "LICENSE", hash = 0x75f07742 }]

[[licenses.clarify]]
crate = "sloper-extension-host"
expression = "LicenseRef-Sloper-Ecosystem-1.0"
license-files = [{ path = "LICENSE", hash = 0x75f07742 }]

[[licenses.clarify]]
crate = "sloper-extension-macros"
expression = "LicenseRef-Sloper-Ecosystem-1.0"
license-files = [{ path = "LICENSE", hash = 0x75f07742 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/sloper-ai/extension-sdk"]
required-git-spec = "rev"
