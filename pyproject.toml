[tool.rumdl]
[tool.rumdl.MD013]
enabled = false

[tool.ryl]
ignore = ["vendor/**"]

[tool.ryl.files]
yaml = ["**/*.yaml", "**/*.yml"]
markdown = ["**/*.md", "**/*.markdown"]

[tool.ryl.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
document-start = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
line-length = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
trailing-spaces = "enable"

[tool.ryl.rules.comments]
level = "warning"
min-spaces-from-content = 1

[tool.ryl.rules.comments-indentation]
level = "warning"

[tool.ryl.rules.truthy]
check-keys = false
level = "warning"

[tool.tombi]

# Vendored sources retain their upstream formatting.
[[tool.tombi.overrides]]
files.include = ["vendor/**"]

[tool.tombi.overrides.format]
enabled = false

[tool.tombi.overrides.lint]
enabled = false

[tool.typos]

# Dependency locks retain their original bytes.
[tool.typos.files]
extend-exclude = ["**/*.lock", "vendor/**"]
