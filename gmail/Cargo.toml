[package]
name = "gmail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Read, send, organize, and administer Gmail through an explicitly connected account."
repository.workspace = true
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64.workspace = true
futures.workspace = true
google-gmail1.workspace = true
http.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper-rustls.workspace = true
mime.workspace = true
serde.workspace = true
serde_json.workspace = true
sloper-extension.workspace = true
thiserror.workspace = true
time.workspace = true
tokio-wasi.workspace = true
tower-service.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait.workspace = true
# Local native HTTP peers exercise the same adapter without external accounts.
hyper-rustls = { workspace = true, features = ["http1"] }
sloper-extension-host.workspace = true
tokio-wasi = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []

[lints]
workspace = true
